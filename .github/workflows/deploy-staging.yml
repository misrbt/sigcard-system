name: Deploy — Staging

on:
  push:
    branches: [staging]

# Prevent two staging deploys running at the same time
concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Staging Server
    runs-on: self-hosted

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Show what is in this staging deploy
        run: |
          git fetch origin main --quiet
          COUNT=$(git rev-list --count origin/main..HEAD)

          echo "======================================"
          echo " STAGING DEPLOY — Commits vs Production"
          echo "======================================"
          echo ""

          if [ "$COUNT" -eq "0" ]; then
            echo "  No new commits vs production. Staging is already in sync."
          else
            echo "  $COUNT commit(s) in this deploy not yet in production:"
            echo ""
            git log origin/main..HEAD --oneline
            echo ""
            echo "  Files changed:"
            git diff --name-only origin/main...HEAD
          fi

          echo ""
          echo "======================================"

      - name: Run staging deploy script
        run: bash "$GITHUB_WORKSPACE/scripts/deploy-staging.sh"

      - name: Write GitHub Actions summary
        run: |
          git fetch origin main --quiet 2>/dev/null || true
          COUNT=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 0)

          echo "## Staging Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed on:** $(date '+%B %d, %Y %H:%M')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$COUNT" -eq "0" ]; then
            echo "✅ Staging already matches production — nothing new to promote." >> $GITHUB_STEP_SUMMARY
          else
            echo "### $COUNT commit(s) ready for production" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Commit | Message |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|---------|" >> $GITHUB_STEP_SUMMARY
            git log origin/main..HEAD --pretty=format:"| \`%h\` | %s |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Files changed" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            git diff --name-only origin/main...HEAD >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> After testing, click **Review deployments** on the next job to deploy to production." >> $GITHUB_STEP_SUMMARY
          fi

  promote-to-production:
    name: "Confirm: Deploy to Production?"
    needs: deploy
    runs-on: self-hosted
    environment: production-gate

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: bash "$GITHUB_WORKSPACE/scripts/deploy-production.sh"
