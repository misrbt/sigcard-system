name: CI — Test & Lint

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, staging, main]

jobs:
  backend-tests:
    name: Backend — Tests
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Set up test environment
        working-directory: backend
        env:
          TEST_DB_HOST:     ${{ secrets.TEST_DB_HOST }}
          TEST_DB_PORT:     ${{ secrets.TEST_DB_PORT }}
          TEST_DB_USERNAME: ${{ secrets.TEST_DB_USERNAME }}
          TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        run: |
          cp .env.testing.example .env.testing

          # Override DB credentials from secrets if provided
          [ -n "$TEST_DB_HOST" ]     && sed -i "s/^DB_HOST=.*/DB_HOST=$TEST_DB_HOST/"             .env.testing
          [ -n "$TEST_DB_PORT" ]     && sed -i "s/^DB_PORT=.*/DB_PORT=$TEST_DB_PORT/"             .env.testing
          [ -n "$TEST_DB_USERNAME" ] && sed -i "s/^DB_USERNAME=.*/DB_USERNAME=$TEST_DB_USERNAME/" .env.testing
          [ -n "$TEST_DB_PASSWORD" ] && sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=$TEST_DB_PASSWORD/" .env.testing

          php artisan key:generate --env=testing

      - name: Run backend tests
        working-directory: backend
        run: php artisan test --env=testing

  frontend-checks:
    name: Frontend — Lint & Build
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build (verify Vite compiles cleanly)
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost/api
          VITE_NODE_ENV: testing
        run: npm run build

  merge-to-staging:
    name: Merge develop → staging
    runs-on: self-hosted
    needs: [backend-tests, frontend-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge develop into staging
        run: |
          git checkout staging
          git merge origin/develop --no-edit
          git push origin staging
