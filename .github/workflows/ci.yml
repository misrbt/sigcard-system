name: CI — Test & Lint

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, staging, main]

jobs:
  backend-tests:
    name: Backend — Tests
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Set up test environment
        working-directory: backend
        run: |
          cp .env.example .env.testing 2>/dev/null || cp .env .env.testing
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=digicur_testing/' .env.testing
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env.testing
          php artisan key:generate --env=testing

      - name: Run backend tests
        working-directory: backend
        run: php artisan test --env=testing

  frontend-checks:
    name: Frontend — Lint & Build
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build (verify Vite compiles cleanly)
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost/api
          VITE_NODE_ENV: testing
        run: npm run build
