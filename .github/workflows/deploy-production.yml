name: Deploy — Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for this manual deploy'
        required: true
        default: 'Manual production deploy'

# Never cancel an in-flight production deploy
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: self-hosted
    # 'production' environment = requires approval in GitHub Settings → Environments
    environment: production

    steps:
      - name: Show deploy info
        run: |
          echo "Deploying branch: ${{ github.ref_name }}"
          echo "Triggered by:     ${{ github.actor }}"
          echo "Reason:           ${{ github.event.inputs.reason || 'push to main' }}"

      - name: Run deploy script
        run: bash /home/rbtwebsrvr/projects/sigcard-system/scripts/deploy-production.sh
