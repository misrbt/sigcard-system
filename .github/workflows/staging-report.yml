name: Staging — What's Ready for Production

on:
  push:
    branches: [staging]

jobs:
  report:
    name: Show changes ready for production
    runs-on: self-hosted

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show commits ahead of production
        run: |
          git fetch origin main --quiet
          COUNT=$(git rev-list --count origin/main..HEAD)

          echo "======================================"
          echo " STAGING REPORT — Ready for Production"
          echo "======================================"
          echo ""

          if [ "$COUNT" -eq "0" ]; then
            echo "✓ Staging is already in sync with production. Nothing new to deploy."
          else
            echo "  $COUNT commit(s) in staging not yet in production:"
            echo ""
            git log origin/main..HEAD --oneline
            echo ""
            echo "  Files changed:"
            git diff --name-only origin/main...HEAD
          fi

          echo ""
          echo "======================================"

      - name: Write GitHub Actions summary
        run: |
          git fetch origin main --quiet 2>/dev/null || true
          COUNT=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 0)

          echo "## Staging Report — Ready for Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date '+%B %d, %Y %H:%M')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$COUNT" -eq "0" ]; then
            echo "✅ Staging is already in sync with production. Nothing new to deploy." >> $GITHUB_STEP_SUMMARY
          else
            echo "### $COUNT commit(s) waiting to go to production" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Commit | Message |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|---------|" >> $GITHUB_STEP_SUMMARY
            git log origin/main..HEAD --pretty=format:"| \`%h\` | %s |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Files changed" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            git diff --name-only origin/main...HEAD >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "When ready: push \`staging\` → \`main\` to deploy to production." >> $GITHUB_STEP_SUMMARY
          fi
